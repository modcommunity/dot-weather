[plugin]

name="dot-weather"
description="Everyday weather as a per-map document: snow, rain, fog, wind and thunderstorms. Lightning and thunder come from a seeded schedule of the shared match time, so every client agrees without a packet. Requires dot-core; dot-fx draws the precipitation and dot-lighting writes the fog when they are installed."
author="dot"
version="0.1.0"
script="dot_weather_plugin.gd"
